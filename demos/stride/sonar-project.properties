sonar.projectKey=esa-mission-registry
sonar.organization=nicktodd
sonar.projectName=ESA Mission Registry
sonar.projectVersion=1.0

# For the SAST demo, scan the vulnerable version to generate interesting findings.
# Switch back to app/src for the "after" / fixed scan.
sonar.sources=app/vulnerable
sonar.tests=tests
sonar.language=py

# Python-specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json

# Exclusions — skip __pycache__ and generated files
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.aws-sam/**

# Encoding
sonar.sourceEncoding=UTF-8
